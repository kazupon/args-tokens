---
name: Benchmark

env:
  CI: true

on:
  pull_request:
    branches:
      - main
    paths:
      - src/**
      - bench/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - vite.config.ts
      - .github/workflows/bench.yml
  push:
    branches:
      - main
    paths:
      - src/**
      - bench/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - vite.config.ts
      - .github/workflows/bench.yml
  workflow_dispatch:
    inputs:
      base:
        description: 'The ref to compare with: a tag, a branch or a commit of v0.28.2 or later (the latest release when empty)'
        required: false
        default: ''
      rounds:
        description: 'The number of rounds'
        required: false
        type: number
        default: 5

permissions: {}

concurrency:
  # a manual run, such as an A/A run, has its own group: it neither cancels nor is cancelled
  group: bench-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  compare:
    name: Compare with the base
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      markdown: ${{ steps.compare.outputs.markdown }}
    steps:
      - name: Checkout head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: head
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve the base
        id: base
        working-directory: head
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_BASE: ${{ inputs.base }}
          PR_BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "$EVENT_NAME" = pull_request ]; then
            # the head is the merge commit of the pull request, whose first parent is the base
            base="$(git rev-parse HEAD^1)"
            label="${PR_BASE_REF} $(git rev-parse --short "$base")"
          elif [ -n "$INPUT_BASE" ]; then
            # the branches other than the checked out one are only remote-tracking branches
            base="$(git rev-parse --verify -q "${INPUT_BASE}^{commit}" || git rev-parse --verify "origin/${INPUT_BASE}^{commit}")"
            label="${INPUT_BASE} $(git rev-parse --short "$base")"
          else
            # the latest release before this commit (HEAD^, since a release commit has its own tag)
            base="$(git describe --tags --abbrev=0 --match 'v*' HEAD^)"
            label="$base"
          fi
          echo "ref=$base" >> "$GITHUB_OUTPUT"
          echo "label=$label" >> "$GITHUB_OUTPUT"

      - name: Checkout base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.base.outputs.ref }}
          path: base
          persist-credentials: false

      - name: Setup Vite Plus
        uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af # v1.21.2
        with:
          node-version: 24
          working-directory: head
          cache: true
          run-install: false

      - name: Build the base and the head
        run: |
          for dir in base head; do
            (cd "$dir" && vp install --frozen-lockfile && vp pack)
          done

      - name: Compare
        id: compare
        working-directory: head
        env:
          ROUNDS: ${{ inputs.rounds || 5 }}
          BASE_LABEL: ${{ steps.base.outputs.label }}
        run: |
          node bench/compare.mjs --base ../base/lib --head lib --rounds "$ROUNDS" \
            --base-label "$BASE_LABEL" --json ../bench.json --markdown ../bench.md
          delimiter="BENCH_$(openssl rand -hex 16)"
          { echo "markdown<<$delimiter"; cat ../bench.md; echo "$delimiter"; } >> "$GITHUB_OUTPUT"

      - name: Write the summary
        run: cat bench.md >> "$GITHUB_STEP_SUMMARY"

  comment:
    name: Comment on the pull request
    needs: compare
    # only for a pull request from a branch of this repository: a pull request from a fork gets a
    # read-only token, so its results stay in the summary of job compare
    if: >-
      github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      # to post and update the comment with the results
      pull-requests: write
    steps:
      # no checkout: this job does not run the code of the pull request
      - name: Post or update the comment
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          MARKDOWN: ${{ needs.compare.outputs.markdown }}
        run: |
          marker='<!-- args-tokens-benchmark -->'
          {
            echo "$marker"
            printf '%s\n\n' "$MARKDOWN"
            echo "Measured at ${HEAD_SHA} merged into its base ([workflow run](${RUN_URL})). The results are informational and do not fail the checks."
          } > body.md
          # the comments that this workflow posted; the first is taken with a parameter expansion
          # rather than `| head -n 1`, which could make gh fail with SIGPIPE
          ids="$(gh api "repos/${REPO}/issues/${PR_NUMBER}/comments" --paginate \
            --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | startswith(\"${marker}\"))) | .id")"
          id="${ids%%$'\n'*}"
          if [ -n "$id" ]; then
            gh api --method PATCH "repos/${REPO}/issues/comments/${id}" -F body=@body.md > /dev/null
          else
            gh api --method POST "repos/${REPO}/issues/${PR_NUMBER}/comments" -F body=@body.md > /dev/null
          fi
