name: Release

# Triggers:
#   - tag push (v*): normal release flow runs npm/jsr publish in parallel,
#     then release-notes on success of both.
#   - workflow_dispatch: fallback recovery. Pick which job to run for an
#     existing tag (npm-publish / jsr-publish / release-notes / all).
#
# CHANGELOG.md is already part of the tagged release commit produced by
# `vp run release`. This workflow does not generate or commit the changelog.
# release-notes only creates the GitHub Release.
on:
  push:
    branches-ignore:
      - '**'
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      job:
        description: Which job to run
        type: choice
        required: true
        default: all
        options:
          - all
          - npm-publish
          - jsr-publish
          - release-notes
      tag:
        description: Existing tag to release (e.g. v1.2.3)
        type: string
        required: true

env:
  TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  VP_GIT_HOOKS: '0'

permissions: {}

jobs:
  npm-publish:
    if: >-
      github.event_name == 'push' || (github.event_name == 'workflow_dispatch' &&
        (inputs.job == 'all' || inputs.job == 'npm-publish'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm OIDC trusted publisher

    steps:
      - name: Checkout codes
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false

      - name: Setup Vite Plus
        uses: voidzero-dev/setup-vp@1b32467adbe183473499fd9d5d372c3ed9641754 # v1.18.0
        with:
          # Node 24 ships npm 11.5+, required for OIDC trusted publishing.
          # Avoid `npm install -g` (zizmor adhoc-packages).
          node-version: 24
          cache: false
          run-install: false

      - name: Install dependencies
        run: vp install --frozen-lockfile

      - name: Build
        run: vp pack

      - name: Publish to npm
        # OIDC trusted publisher: requires id-token: write, no NPM_TOKEN needed.
        # Provenance is automatically attached via OIDC.
        run: npm publish --provenance --access public --tag latest

  jsr-publish:
    if: >-
      github.event_name == 'push' || (github.event_name == 'workflow_dispatch' &&
        (inputs.job == 'all' || inputs.job == 'jsr-publish'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # JSR OIDC

    steps:
      - name: Checkout codes
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false

      - name: Setup Vite Plus
        uses: voidzero-dev/setup-vp@1b32467adbe183473499fd9d5d372c3ed9641754 # v1.18.0
        with:
          node-version: 22
          cache: true
          run-install: false

      - name: Install dependencies
        run: vp install --frozen-lockfile

      - name: Build
        run: vp pack

      - name: Publish to JSR
        run: vp exec jsr publish --config jsr.json

  release-notes:
    needs:
      - npm-publish
      - jsr-publish
    if: >-
      always() && (
        (github.event_name == 'push' &&
          needs.npm-publish.result == 'success' &&
          needs.jsr-publish.result == 'success') ||
        (github.event_name == 'workflow_dispatch' && inputs.job == 'release-notes') ||
        (github.event_name == 'workflow_dispatch' && inputs.job == 'all' &&
          needs.npm-publish.result == 'success' &&
          needs.jsr-publish.result == 'success')
      )
    runs-on: ubuntu-latest
    permissions:
      contents: write # create GitHub Release

    steps:
      - name: Checkout tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false

      - name: Create GitHub Release (idempotent)
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists, skipping creation"
          else
            FLAGS=(--verify-tag --generate-notes)
            # SemVer prerelease: '-' after major.minor.patch, not build metadata.
            if [[ "$TAG" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+- ]]; then
              FLAGS+=(--prerelease)
            fi
            gh release create "$TAG" "${FLAGS[@]}"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
